{% extends 'base.html' %}
{% block content %}
<div class="page-header">
    <h2>{{ title }}</h2>
    <a href="{{ url_for('clients') }}" class="btn btn-secondary">Назад</a>
</div>

<div class="card">
    <form method="POST" class="standard-form">
        <div class="form-row">
            <div class="form-group half">
                <label for="full_name">ПІБ / Назва компанії *</label>
                <input type="text" id="full_name" name="full_name" required value="{{ client.full_name if client else '' }}">
            </div>
            <div class="form-group half">
                <label for="phone">Контактний телефон</label>
                <input type="text" id="phone" name="phone" value="{{ client.phone if client else '' }}">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group full">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" value="{{ client.email if client else '' }}">
            </div>
        </div>

        <div class="form-group full">
            <label for="notes">Примітки (наприклад: платник ПДВ, надійність тощо)</label>
            <textarea id="notes" name="notes" rows="4">{{ client.notes if client else '' }}</textarea>
        </div>

        <button type="submit" class="btn btn-primary">Зберегти контакт</button>
    </form>
</div>
{% endblock %}
