{% extends 'base.html' %}
{% block content %}
<div class="page-header">
    <h2>{{ title }}</h2>
    <a href="{{ url_for('cargo_requests') }}" class="btn btn-secondary">Назад</a>
</div>

<div class="card">
    <form method="POST" class="standard-form">
        <div class="form-group full">
            <label for="client_id">Оберіть замовника *</label>
            <select id="client_id" name="client_id" required>
                <option value="">-- Оберіть зі списку --</option>
                {% for client in clients %}
                    <option value="{{ client.id }}">{{ client.full_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-row">
            <div class="form-group half">
                <label for="origin_city">Місто відправлення *</label>
                <input type="text" id="origin_city" name="origin_city" required>
            </div>
            <div class="form-group half">
                <label for="destination_city">Місто призначення *</label>
                <input type="text" id="destination_city" name="destination_city" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group third">
                <label for="cargo_type">Тип вантажу *</label>
                <input type="text" id="cargo_type" name="cargo_type" required>
            </div>
            <div class="form-group third">
                <label for="weight_tons">Вага (тонн) *</label>
                <input type="number" step="0.1" min="0.1" id="weight_tons" name="weight_tons" required>
            </div>
            <div class="form-group third">
                <label for="desired_date">Бажана дата *</label>
                <input type="date" id="desired_date" name="desired_date" required>
            </div>
        </div>

        <div class="form-group full">
            <label for="notes">Примітки (умови оплати, вимоги до авто)</label>
            <textarea id="notes" name="notes" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Зберегти заявку</button>
    </form>
</div>
{% endblock %}
